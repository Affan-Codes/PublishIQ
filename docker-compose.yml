version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: publishiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-publishiq}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d publishiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: publishiq-valkey
    restart: unless-stopped
    command: valkey-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: publishiq-api
    restart: unless-stopped
    command: npm run dev
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
      - media_data:/usr/src/app/media
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-4000}
      - DATABASE_URL=${DATABASE_URL}
      - VALKEY_URL=${VALKEY_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - MEDIA_ROOT=${MEDIA_ROOT:-/usr/src/app/media}
      - QUEUE_PREFIX=${QUEUE_PREFIX:-publishiq}
      - OPERATOR_EMAIL=${OPERATOR_EMAIL:-admin@publishiq.com}
      - OPERATOR_PASSWORD=${OPERATOR_PASSWORD:-admin1234_default_secret_passphrase}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: publishiq-worker
    restart: unless-stopped
    command: npx tsx watch src/worker.ts
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
      - media_data:/usr/src/app/media
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=${DATABASE_URL}
      - VALKEY_URL=${VALKEY_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - MEDIA_ROOT=${MEDIA_ROOT:-/usr/src/app/media}
      - QUEUE_PREFIX=${QUEUE_PREFIX:-publishiq}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: publishiq-frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - '5173:5173'
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:4000/api/v1}
    depends_on:
      - api

volumes:
  postgres_data:
    driver: local
  valkey_data:
    driver: local
  media_data:
    driver: local
